    <!-- Critical CSS to prevent FOUC -->
    <style>
      .preload * {
        -webkit-transition: none !important;
        -moz-transition: none !important;
        -ms-transition: none !important;
        -o-transition: none !important;
        transition: none !important;
      }

      html {
        visibility: visible;
        opacity: 1;
      }

      html.preload {
        visibility: hidden;
        opacity: 0;
      }

      .bg-image {
        content: "";
        background-image: url("../../resources/images/TerrainMapFrontPage.png"),
          radial-gradient(
            circle at 8% 18%,
            rgba(168, 85, 247, 0.12),
            transparent 34%
          ),
          radial-gradient(
            circle at 82% 12%,
            rgba(99, 102, 241, 0.14),
            transparent 40%
          ),
          linear-gradient(120deg, rgba(5, 7, 18, 0.72), rgba(10, 8, 32, 0.82));
        background-position: center;
        background-attachment: fixed;
        background-size: cover;
        background-blend-mode: normal, screen, screen, multiply;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
        filter: saturate(1.08) contrast(1.02) brightness(0.92) blur(2.6px);
        overflow: hidden;
      }

      .bg-image::before {
        content: "";
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(
            90deg,
            rgba(255, 255, 255, 0.03) 0,
            rgba(255, 255, 255, 0.03) 1px,
            transparent 1px,
            transparent 120px
          ),
          repeating-linear-gradient(
            0deg,
            rgba(255, 255, 255, 0.03) 0,
            rgba(255, 255, 255, 0.03) 1px,
            transparent 1px,
            transparent 120px
          );
        mix-blend-mode: overlay;
        opacity: 0.8;
        filter: blur(0.3px);
      }

      .bg-image::after {
        content: "";
        position: absolute;
        inset: -40% -20%;
        background: radial-gradient(
          circle at 30% 30%,
          rgba(168, 85, 247, 0.3),
          transparent 40%
        );
        mix-blend-mode: screen;
        opacity: 0.7;
        animation: aurora 16s ease-in-out infinite;
      }

      @keyframes aurora {
        0% {
          transform: translate3d(0, 0, 0) scale(1);
        }
        50% {
          transform: translate3d(-6%, 4%, 0) scale(1.08);
        }
        100% {
          transform: translate3d(4%, -4%, 0) scale(1);
        }
      }

      .dark .bg-image {
        filter: brightness(0.72) saturate(0.94) contrast(1.12) blur(2.6px);
      }

      /* display:none if child has class parent-hidden since we can't use shadow DOM in Lit due to Tailwind */
      .component-hideable:has(> .parent-hidden) {
        display: none;
      }
    </style>

    <!-- Immediate execution to prevent FOUC -->
    <script>
      document.documentElement.className = "preload";
    </script>

    <!-- Publift/Fuse ads -->
    <script

        <div class="container__row container__row--equal">

          <o-button
